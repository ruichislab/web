<section class="herramientas-web-section">
  <div class="container">
    <h1 class="section-title glitch" data-text="HERRAMIENTAS WEB">
      <span class="title-icon">🛠️</span>
      HERRAMIENTAS WEB
    </h1>
    <div class="web-tools-grid">
      <div class="web-tool-card">
        <h2 class="tool-title">¿Cuál es mi IP?</h2>
        <p class="tool-description">Consulta tu dirección IP pública actual.</p>
        <div class="ip-result">
          <span class="ip-label">Tu IP:</span>
          <span class="ip-value" id="ip-result">Detectando...</span>
        </div>
        <button class="btn-cyber" onclick="fetchIP()">
          <span class="btn-icon">🔄</span>
          Actualizar IP
        </button>
      </div>
    </div>
  </div>
</section>
